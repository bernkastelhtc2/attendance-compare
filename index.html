<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>出席率及準時率 · 明愛聖若瑟中學</title>
<style>
:root{--navy:#1b3a4b;--ink:#1c1917;--muted:#5c564e;--paper:#f6f1e8;--gold:#b08958;--forest:#2c4a3e;--clay:#8c4a3a;--line:#e4dcce}
*{box-sizing:border-box}body{margin:0;font-family:"PingFang HK","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:28px 32px 22px;border-bottom:4px solid var(--gold)}
header .k{color:var(--gold);font-size:13px;letter-spacing:.08em}header h1{margin:6px 0 4px;font-size:28px}header p{margin:0;color:#d9d0c4;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 48px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 18px}
.seg,.months{display:flex;gap:8px;flex-wrap:wrap}.seg{background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);gap:0}
.seg button,.months button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--navy);font-family:inherit}
.months button{background:#fff;border:1px solid var(--line);border-radius:10px}
.seg button.active,.months button.active{background:var(--navy);color:#fff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.card{background:#fff;border-radius:12px;padding:14px 16px;border-top:4px solid var(--forest)}
.card.warn{border-top-color:var(--clay)}.card .label{font-size:13px;color:var(--muted)}.card .value{font-size:30px;font-weight:700;color:var(--navy);margin:4px 0}.card .sub{font-size:12px;color:var(--muted)}
.delta{font-size:13px;font-weight:600;margin-top:4px}.delta.up{color:var(--forest)}.delta.down{color:var(--clay)}.delta.flat{color:var(--muted)}
.panel{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px}.panel h2{margin:0 0 12px;font-size:16px;color:var(--navy)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:8px}.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--navy);color:#fff;cursor:pointer}th:first-child,td:first-child{text-align:left;padding-left:10px}
tr:nth-child(even) td{background:#fbf8f3}td.bad{color:var(--clay);font-weight:700;background:#f6e6e1!important}
.bar-row{display:grid;grid-template-columns:48px 1fr 70px 70px;gap:8px;align-items:center;margin:6px 0}
.bars{position:relative;height:28px}.bar{position:absolute;left:0;height:12px;border-radius:3px}.bar.a{top:0;background:var(--navy)}.bar.b{top:15px;background:var(--gold)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}header{padding:20px}}
</style>
</head>
<body>
<header>
  <div class="k">明愛聖若瑟中學 · 教務</div>
  <h1>出席率及準時率</h1>
  <p>按班別比較各月情況。之後月份可直接加入資料繼續對比。</p>
</header>
<div class="wrap">
  <div class="toolbar">
    <div class="seg" id="mode"><button data-mode="single" class="active">單月</button><button data-mode="compare">比較兩月</button></div>
    <div class="months" id="months"></div>
    <div class="months" id="monthsB" style="display:none"></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="panel"><h2>各級比較</h2><div class="legend" id="legend"></div><div id="formChart"></div></div>
  <div class="panel"><h2>各班一覽</h2><div id="table"></div><div class="note" id="note"></div></div>
</div>
<script>
const DATA={"2026-09":{label:"2026年9月",days:null,students:418,school:{att:94.29,on:97.37,both:91.81,late:228,severe:23},classes:{"1A":{n:21,att:89.83,on:94.46,both:84.85,late:20,severe:3},"1B":{n:24,att:94.40,on:97.08,both:91.65,late:11,severe:4},"1C":{n:16,att:93.89,on:96.07,both:90.20,late:9,severe:4},"2A":{n:18,att:88.89,on:99.43,both:88.38,late:2,severe:0},"2B":{n:26,att:92.20,on:98.01,both:90.37,late:7,severe:3},"2C":{n:28,att:96.92,on:97.65,both:94.64,late:13,severe:1},"3A":{n:31,att:91.72,on:96.80,both:88.78,late:19,severe:1},"3B":{n:33,att:94.80,on:99.57,both:94.39,late:3,severe:0},"3C":{n:31,att:93.77,on:97.03,both:90.98,late:17,severe:2},"4A":{n:32,att:95.66,on:96.69,both:92.49,late:21,severe:2},"4B":{n:29,att:93.36,on:96.32,both:89.92,late:20,severe:2},"4C":{n:29,att:98.12,on:96.96,both:95.14,late:19,severe:0},"5A":{n:26,att:95.29,on:98.29,both:93.66,late:9,severe:0},"5B":{n:23,att:92.09,on:97.64,both:89.92,late:11,severe:0},"6A":{n:23,att:98.91,on:98.00,both:96.94,late:9,severe:1},"6B":{n:13,att:95.45,on:95.97,both:91.61,late:11,severe:0},"6C":{n:15,att:96.06,on:98.74,both:94.85,late:4,severe:0}}},"2026-10":{label:"2026年10月",days:23,students:412,school:{att:93.84,on:99.09,both:92.99,late:161,severe:38},classes:{"1A":{n:21,att:90.27,on:99.20,both:89.54,late:7,severe:4},"1B":{n:22,att:97.92,on:99.60,both:97.53,late:4,severe:0},"1C":{n:16,att:94.29,on:99.28,both:93.61,late:5,severe:2},"2A":{n:18,att:87.56,on:99.59,both:87.20,late:3,severe:1},"2B":{n:26,att:96.32,on:99.22,both:95.57,late:9,severe:2},"2C":{n:28,att:94.57,on:99.67,both:94.25,late:4,severe:1},"3A":{n:31,att:87.87,on:99.28,both:87.24,late:9,severe:2},"3B":{n:32,att:95.58,on:99.36,both:94.97,late:9,severe:4},"3C":{n:31,att:92.08,on:98.86,both:91.02,late:15,severe:3},"4A":{n:31,att:92.99,on:97.36,both:90.53,late:35,severe:8},"4B":{n:28,att:94.95,on:98.86,both:93.87,late:14,severe:3},"4C":{n:29,att:97.30,on:99.38,both:96.70,late:8,severe:1},"5A":{n:25,att:97.13,on:98.84,both:96.00,late:13,severe:1},"5B":{n:23,att:91.87,on:99.07,both:91.02,late:9,severe:1},"6A":{n:23,att:98.11,on:99.61,both:97.73,late:4,severe:1},"6B":{n:13,att:93.81,on:98.93,both:92.81,late:6,severe:0},"6C":{n:15,att:90.43,on:98.88,both:89.42,late:7,severe:4}}}};
const KEYS=Object.keys(DATA);
const CLASSES=Object.keys(DATA[KEYS[0]].classes);
let mode="single", monthA=KEYS[KEYS.length-1], monthB=KEYS[KEYS.length-2]||KEYS[0], sortKey="cls", sortDir=1;
function formOf(c){return c[0]}
function formAgg(month){
  const out={};
  for(const [cls,d] of Object.entries(DATA[month].classes)){
    const f=formOf(cls);
    if(!out[f]) out[f]={n:0,attN:0,onN:0,bothN:0,late:0,severe:0};
    out[f].n+=d.n; out[f].attN+=d.att*d.n; out[f].onN+=d.on*d.n; out[f].bothN+=d.both*d.n; out[f].late+=d.late; out[f].severe+=d.severe;
  }
  for(const f of Object.keys(out)){const g=out[f]; g.att=g.attN/g.n; g.on=g.onN/g.n; g.both=g.bothN/g.n}
  return out;
}
function delta(a,b){const d=a-b; const c=d>0.05?"up":d<-0.05?"down":"flat"; return `<div class="delta ${c}">${d>0?"+":""}${d.toFixed(2)}</div>`}
function deltaCount(a,b){const d=a-b; const c=d<0?"up":d>0?"down":"flat"; return `<div class="delta ${c}">${d>0?"+":""}${d}</div>`}
function renderMonths(){
  const box=document.getElementById("months"), boxB=document.getElementById("monthsB");
  box.innerHTML=KEYS.map(k=>`<button data-m="${k}" class="${k===monthA?"active":""}">${DATA[k].label}</button>`).join("");
  boxB.innerHTML=KEYS.map(k=>`<button data-m="${k}" class="${k===monthB?"active":""}">對比 ${DATA[k].label}</button>`).join("");
  boxB.style.display=mode==="compare"?"flex":"none";
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{monthA=b.dataset.m; render()});
  boxB.querySelectorAll("button").forEach(b=>b.onclick=()=>{monthB=b.dataset.m; render()});
}
document.getElementById("mode").onclick=e=>{
  if(!e.target.dataset.mode) return;
  mode=e.target.dataset.mode;
  document.querySelectorAll("#mode button").forEach(b=>b.classList.toggle("active", b.dataset.mode===mode));
  render();
};
function renderCards(){
  const A=DATA[monthA].school, B=DATA[monthB].school;
  const items=[["出席率",A.att,B.att,"%",false],["準時率",A.on,B.on,"%",false],["出席並準時",A.both,B.both,"%",false],["遲到次數",A.late,B.late,"",true]];
  document.getElementById("cards").innerHTML=items.map((it,i)=>{
    const [label,a,b,unit,invert]=it;
    const extra=mode==="compare"?(invert?deltaCount(a,b):delta(a,b)):"";
    return `<div class="card ${i===0&&a<94?"warn":""}"><div class="label">${label}${mode==="compare"?` · ${DATA[monthA].label}`:""}</div><div class="value">${a.toFixed(unit==="%"?2:0)}${unit}</div><div class="sub">${DATA[monthA].students} 人${DATA[monthA].days?` · ${DATA[monthA].days} 上課日`:""}</div>${extra}</div>`;
  }).join("");
}
function renderForms(){
  const FA=formAgg(monthA), FB=formAgg(monthB), forms=["1","2","3","4","5","6"];
  document.getElementById("legend").innerHTML=mode==="compare"
    ?`<span><i class="sw" style="background:var(--navy)"></i>${DATA[monthA].label} 出席率</span><span><i class="sw" style="background:var(--gold)"></i>${DATA[monthB].label} 出席率</span>`
    :`<span><i class="sw" style="background:var(--navy)"></i>出席率</span><span><i class="sw" style="background:var(--gold)"></i>準時率</span>`;
  document.getElementById("formChart").innerHTML=forms.map(f=>{
    const a=FA[f], b=FB[f];
    if(mode==="compare") return `<div class="bar-row"><div>中${["","一","二","三","四","五","六"][f]}</div><div class="bars"><div class="bar a" style="width:${a.att}%"></div><div class="bar b" style="width:${b.att}%"></div></div><div>${a.att.toFixed(2)}%</div><div>${b.att.toFixed(2)}%</div></div>`;
    return `<div class="bar-row"><div>中${["","一","二","三","四","五","六"][f]}</div><div class="bars"><div class="bar a" style="width:${a.att}%"></div><div class="bar b" style="width:${a.on}%"></div></div><div>${a.att.toFixed(2)}%</div><div>${a.on.toFixed(2)}%</div></div>`;
  }).join("");
}
function renderTable(){
  const A=DATA[monthA].classes, B=DATA[monthB].classes;
  let rows=CLASSES.map(cls=>({cls,a:A[cls],b:B[cls]}));
  const val=r=>sortKey==="cls"?r.cls:sortKey==="dAtt"?r.a.att-r.b.att:sortKey==="dOn"?r.a.on-r.b.on:r.a[sortKey];
  rows.sort((x,y)=>{const vx=val(x),vy=val(y); return typeof vx==="string"?vx.localeCompare(vy)*sortDir:(vx-vy)*sortDir});
  const heads=mode==="compare"?[["cls","班別"],["n","人數"],["att","出席率"],["dAtt","出席差"],["on","準時率"],["dOn","準時差"],["late","遲到"],["severe","嚴重"]]:[["cls","班別"],["n","人數"],["att","出席率"],["on","準時率"],["both","出席並準時"],["late","遲到"],["severe","嚴重"]];
  let html=`<table><thead><tr>${heads.map(([k,t])=>`<th data-k="${k}">${t}</th>`).join("")}</tr></thead><tbody>`;
  for(const r of rows){
    const lowAtt=r.a.att<92, lowOn=r.a.on<98;
    if(mode==="compare"){
      const da=r.a.att-r.b.att, dn=r.a.on-r.b.on;
      html+=`<tr><td>${r.cls}</td><td>${r.a.n}</td><td class="${lowAtt?"bad":""}">${r.a.att.toFixed(2)}%</td><td class="${da<-1?"bad":""}">${da>0?"+":""}${da.toFixed(2)}</td><td class="${lowOn?"bad":""}">${r.a.on.toFixed(2)}%</td><td class="${dn<-1?"bad":""}">${dn>0?"+":""}${dn.toFixed(2)}</td><td class="${r.a.late>=15?"bad":""}">${r.a.late}</td><td class="${r.a.severe>=4?"bad":""}">${r.a.severe}</td></tr>`;
    } else {
      html+=`<tr><td>${r.cls}</td><td>${r.a.n}</td><td class="${lowAtt?"bad":""}">${r.a.att.toFixed(2)}%</td><td class="${lowOn?"bad":""}">${r.a.on.toFixed(2)}%</td><td class="${r.a.both<90?"bad":""}">${r.a.both.toFixed(2)}%</td><td class="${r.a.late>=15?"bad":""}">${r.a.late}</td><td class="${r.a.severe>=4?"bad":""}">${r.a.severe}</td></tr>`;
    }
  }
  html+="</tbody></table>";
  document.getElementById("table").innerHTML=html;
  document.querySelectorAll("#table th").forEach(th=>th.onclick=()=>{const k=th.dataset.k; if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=k==="cls"?1:-1} renderTable()});
  document.getElementById("note").textContent=mode==="compare"
    ?`正在比較 ${DATA[monthA].label} 與 ${DATA[monthB].label}。差額 = 前者 − 後者。出席率偏低（低於 92%）及準時率偏低（低於 98%）已標色。`
    :"出席率 = 出席 ÷ 應到。準時率 = 已出席學生中準時到達的比例。嚴重遲到已包含在遲到之內。";
}
function render(){renderMonths(); renderCards(); renderForms(); renderTable()}
render();
</script>
</body>
</html>
